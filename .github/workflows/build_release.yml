name: Build & Release Mangayomi (APK + IPA)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.9.9)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.18.1'

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Gradle properties
        run: |
          echo "org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m -XX:+UseG1GC" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release_artifacts/Mangayomi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangayomi-apk
          path: release_artifacts/Mangayomi.apk

  build-ios:
    name: 🍎 Build iOS Release IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Release App (Unsigned for Sideloading / AltStore)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .app into .ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Mangayomi.ipa Payload
          cd ../../..
          mkdir -p release_artifacts
          cp build/ios/iphoneos/Mangayomi.ipa release_artifacts/Mangayomi.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangayomi-ipa
          path: release_artifacts/Mangayomi.ipa

  release:
    name: 🚀 Create GitHub Release (APK + IPA)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: mangayomi-apk
          path: release_artifacts

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: mangayomi-ipa
          path: release_artifacts

      - name: Extract Tag or Version
        id: vars
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ -n "$REF_NAME" ] && [[ "$REF_NAME" == v* ]]; then
            echo "TAG=$REF_NAME" >> $GITHUB_OUTPUT
          else
            VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' "')
            echo "TAG=v$VER" >> $GITHUB_OUTPUT
          fi

      - name: Publish Dual Release (APK + IPA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: "Mangayomi ${{ steps.vars.outputs.TAG }} (Android APK + iOS IPA)"
          body: |
            ## 🎬 Mangayomi ${{ steps.vars.outputs.TAG }}
            Manga & Anime App with Motion Comic Mode & Thai Voice Narrator

            ### 📦 ไฟล์ติดตั้งที่พร้อมใช้งาน:
            - **🤖 Android APK:** `Mangayomi.apk` (ติดตั้งได้ทันทีบน Android ทุกรุ่น)
            - **🍎 iOS IPA:** `Mangayomi.ipa` (ติดตั้งบน iPhone / iPad ผ่าน AltStore, Sideloadly, หรือ TrollStore)

            ---
            ### 📱 วิธีติดตั้งบน iOS (iPhone / iPad):
            1. ดาวน์โหลดไฟล์ `Mangayomi.ipa`
            2. ติดตั้งผ่านโปรแกรม **Sideloadly** หรือ **AltStore** บนคอมพิวเตอร์ (Sign ฟรีด้วย Apple ID)
            3. เข้าไปที่ **การตั้งค่า (Settings)** -> **ทั่วไป (General)** -> **VPN & การจัดการอุปกรณ์** แล้วแตะ **เชื่อถือ (Trust)**
          files: |
            release_artifacts/Mangayomi.apk
            release_artifacts/Mangayomi.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
